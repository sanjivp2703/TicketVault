<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Complaints</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f3f3; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #ddd; padding: 2em; }
        h2 { color: #b71c1c; }
        table { width: 100%; border-collapse: collapse; margin-top: 1.5em; }
        th, td { padding: 0.7em; border-bottom: 1px solid #eee; }
        th { background: #f8d7da; color: #b71c1c; }
        td { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Complaints / Claims</h2>
        <table>
            <tr>
                <th>Transaction ID</th>
                <th>Reason</th>
            </tr>
            {% for c in complaints %}
            <tr>
                <td>{{ c.transaction_id }}</td>
                <td>{{ c.termination_reason }}</td>
            </tr>
            {% else %}
            <tr><td colspan="2" style="color:#888;">No complaints submitted.</td></tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
