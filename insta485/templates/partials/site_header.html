{#- Shared top navigation. Shows account details when a user is signed in. -#}
<header class="site-header">
    <div class="container site-header__inner">
        <div class="cluster">
            {% include "partials/brand.html" %}
            <nav class="site-header__nav" aria-label="Primary">
                <a class="nav-link" href="{{ url_for('show_how_it_works') }}">How it works</a>
            </nav>
        </div>
        {% if session.get('email') %}
        <div class="user-chip">
            <div class="user-chip__meta">
                <span class="user-chip__name">{{ session['email'] }}</span>
            </div>
            <span class="avatar" aria-hidden="true">{{ session['email'][0] | upper }}</span>
            <a class="btn btn--secondary btn--sm" href="{{ url_for('logout') }}">Sign out</a>
        </div>
        {% endif %}
    </div>
</header>
