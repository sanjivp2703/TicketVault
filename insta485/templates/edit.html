{% extends "layouts/base.html" %}
{% block title %}Edit account{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/forms.css') }}">
{% endblock %}

{% block content %}
<main class="page">
    <div class="container container--narrow">
        <header class="page-header">
            <h1 class="page-header__title">Edit account</h1>
        </header>

        <section class="card form-card" aria-labelledby="profile-title">
            <div class="card__body">
                <h2 class="form-section-title" id="profile-title">Update profile</h2>
                <form action="{{ url_for('manage_accounts') }}" method="post">
                    <input type="hidden" name="operation" value="edit_account">
                    <div class="form-row">
                        <div class="form-field">
                            <label class="label" for="firstname">First name</label>
                            <input class="input" type="text" id="firstname" name="firstname" value="{{ user.firstname }}" autocomplete="given-name" required>
                        </div>
                        <div class="form-field">
                            <label class="label" for="lastname">Last name</label>
                            <input class="input" type="text" id="lastname" name="lastname" value="{{ user.lastname }}" autocomplete="family-name" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn--primary">Update profile</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card form-card" aria-labelledby="password-title">
            <div class="card__body">
                <h2 class="form-section-title" id="password-title">Change password</h2>
                <form action="{{ url_for('manage_accounts') }}" method="post">
                    <input type="hidden" name="operation" value="update_password">
                    <div class="form-field">
                        <label class="label" for="password">Old password</label>
                        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <div class="form-field">
                        <label class="label" for="new_password1">New password</label>
                        <input class="input" type="password" id="new_password1" name="new_password1" autocomplete="new-password" required>
                    </div>
                    <div class="form-field">
                        <label class="label" for="new_password2">Confirm new password</label>
                        <input class="input" type="password" id="new_password2" name="new_password2" autocomplete="new-password" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn--primary">Change password</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card form-card" aria-labelledby="delete-title">
            <div class="card__body">
                <h2 class="form-section-title" id="delete-title">Delete account</h2>
                <form action="{{ url_for('manage_accounts') }}" method="post">
                    <input type="hidden" name="operation" value="delete">
                    <button type="submit" class="btn btn--danger-outline">Delete account</button>
                </form>
            </div>
        </section>
    </div>
</main>
{% endblock %}
