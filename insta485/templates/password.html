{% extends "layouts/base.html" %}
{% block title %}Change password{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/forms.css') }}">
{% endblock %}

{% block content %}
<main class="page">
    <div class="container container--narrow">
        <header class="page-header">
            <h1 class="page-header__title">Change password</h1>
        </header>

        <section class="card form-card">
            <div class="card__body">
                <!-- DO NOT CHANGE THIS: form action, field names and values are relied on by the server. -->
                <form action="{{ url_for('manage_accounts') }}?target={{ url_for('show_accounts', url = 'edit') }}" method="post" enctype="multipart/form-data">
                    <div class="form-field">
                        <label class="label" for="password">Old password</label>
                        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required/>
                    </div>
                    <div class="form-field">
                        <label class="label" for="new_password1">New password</label>
                        <input class="input" type="password" id="new_password1" name="new_password1" autocomplete="new-password" required/>
                    </div>
                    <div class="form-field">
                        <label class="label" for="new_password2">New password, again</label>
                        <input class="input" type="password" id="new_password2" name="new_password2" autocomplete="new-password" required/>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn--primary" name="update_password" value="submit">Change password</button>
                    </div>
                    <input type="hidden" name="operation" value="update_password"/>
                </form>
            </div>
        </section>
    </div>
</main>
{% endblock %}
