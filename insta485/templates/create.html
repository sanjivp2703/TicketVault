{% extends "layouts/auth.html" %}
{% block title %}Create account{% endblock %}

{% block auth_content %}
<h1 class="auth__title">Create your account</h1>
<p class="auth__subtitle">Start selling tickets with escrow protection in a few minutes.</p>

{% if error %}
<div class="alert alert--danger mb-6" role="alert">
    <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
    <span>{{ error }}</span>
</div>
{% endif %}

<form action="{{ url_for('create') }}" method="post" enctype="multipart/form-data">
    <input type="hidden" name="operation" value="create">

    <div class="form-field">
        <label class="label" for="firstname">Name</label>
        <input class="input" type="text" id="firstname" name="firstname" placeholder="Jane Doe" autocomplete="name" required autofocus>
    </div>

    <div class="form-field">
        <label class="label" for="phone_number">Phone number</label>
        <div class="input-group">
            <span class="input-group__addon" aria-hidden="true">+1</span>
            <input class="input" type="tel" id="phone_number" name="phone_number" placeholder="(555) 123-4567" autocomplete="tel-national" required>
        </div>
    </div>

    <div class="form-field">
        <label class="label" for="email">Email address</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
    </div>

    <div class="form-field">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
    </div>

    <button type="submit" class="btn btn--primary btn--lg btn--block">Create account</button>
</form>

<p class="auth__switch">
    Already have an account? <a href="{{ url_for('show_accounts', url='login') }}">Sign in</a>
</p>
{% endblock %}
