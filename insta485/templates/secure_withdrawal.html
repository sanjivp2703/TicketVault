<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Withdrawal - Safe Transaction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a202c 50%, #2d3748 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .withdrawal-container {
            width: 90vw;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .header {
            margin-bottom: 30px;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #10b981, #059669);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }

        .balance-display {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .balance-label {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .maze-instruction {
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
        }

        .maze-container {
            width: 100%;
            height: 400px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .maze-canvas {
            width: 100%;
            height: 100%;
            cursor: none;
        }

        .orb {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #60a5fa, #3b82f6);
            border-radius: 50%;
            position: absolute;
            transition: all 0.1s ease;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.6);
            z-index: 10;
        }

        .maze-wall {
            background: #475569;
            position: absolute;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.1);
        }

        .maze-path {
            background: transparent;
            position: absolute;
        }

        .finish-zone {
            background: linear-gradient(135deg, #10b981, #059669);
            position: absolute;
            border-radius: 8px;
            animation: finish-glow 1.5s infinite;
        }

        @keyframes finish-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
            50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.8); }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #374151;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            width: 0%;
            transition: width 0.3s ease;
        }

        .withdraw-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .withdraw-button:disabled {
            cursor: not-allowed;
        }

        .withdraw-button.enabled {
            opacity: 1;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal h3 {
            margin-bottom: 20px;
            color: #e2e8f0;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .modal input::placeholder {
            color: #94a3b8;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-button.primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .modal-button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-message.show {
            opacity: 1;
        }

        .status-message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .status-message.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        @media (max-width: 768px) {
            .withdrawal-container {
                padding: 20px;
                width: 95vw;
            }
            
            .maze-container {
                height: 300px;
            }
            
            .balance-display {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="withdrawal-container">
        <div class="header">
            <div class="security-badge">
                🔒 Secure Withdrawal Protocol
            </div>
            <div class="balance-display">${{ user_balance or "0.00" }}</div>
            <div class="balance-label">Available Balance</div>
        </div>

        <div class="maze-instruction">
            🎯 Guide the orb through the secure path to authorize withdrawal
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="maze-container" id="mazeContainer">
            <canvas class="maze-canvas" id="mazeCanvas"></canvas>
            <div class="orb" id="orb"></div>
        </div>

        <button class="withdraw-button" id="withdrawButton" disabled>
            Complete Security Verification
        </button>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <!-- Modal for bank details -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Bank Details Required</h3>
            <div id="modalContent">
                <input type="text" id="accountNumber" placeholder="Account Number" maxlength="20">
                <input type="text" id="routingNumber" placeholder="Routing Number" maxlength="9">
                <input type="text" id="bankName" placeholder="Bank Name">
            </div>
            <div class="modal-buttons">
                <button class="modal-button secondary" onclick="closeModal()">Cancel</button>
                <button class="modal-button primary" onclick="confirmWithdrawal()">Confirm Withdrawal</button>
            </div>
        </div>
    </div>

    <script>
        class SecureMazeWithdrawal {
            constructor() {
                this.canvas = document.getElementById('mazeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.orb = document.getElementById('orb');
                this.container = document.getElementById('mazeContainer');
                this.progressFill = document.getElementById('progressFill');
                this.withdrawButton = document.getElementById('withdrawButton');
                
                this.cellSize = 20;
                this.maze = [];
                this.orbPosition = { x: 0, y: 0 };
                this.startPosition = { x: 1, y: 1 };
                this.endPosition = { x: 0, y: 0 };
                this.validPath = [];
                this.currentProgress = 0;
                this.isDragging = false;
                this.userBalance = {{ user_balance or 0 }};
                
                this.initializeCanvas();
                this.generateMaze();
                this.setupEventListeners();
                this.positionOrb();
            }

            initializeCanvas() {
                const rect = this.container.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                
                this.cols = Math.floor(this.canvas.width / this.cellSize);
                this.rows = Math.floor(this.canvas.height / this.cellSize);
                
                // Ensure odd dimensions for proper maze generation
                if (this.cols % 2 === 0) this.cols--;
                if (this.rows % 2 === 0) this.rows--;
            }

            generateMaze() {
                // Initialize maze with walls
                this.maze = Array(this.rows).fill().map(() => Array(this.cols).fill(1));
                
                // Generate maze using recursive backtracking
                const stack = [];
                const startX = 1;
                const startY = 1;
                
                this.maze[startY][startX] = 0;
                stack.push([startX, startY]);
                
                const directions = [[0, 2], [2, 0], [0, -2], [-2, 0]];
                
                while (stack.length > 0) {
                    const [x, y] = stack[stack.length - 1];
                    const neighbors = [];
                    
                    for (let [dx, dy] of directions) {
                        const nx = x + dx;
                        const ny = y + dy;
                        
                        if (nx > 0 && nx < this.cols - 1 && ny > 0 && ny < this.rows - 1 && this.maze[ny][nx] === 1) {
                            neighbors.push([nx, ny, x + dx/2, y + dy/2]);
                        }
                    }
                    
                    if (neighbors.length > 0) {
                        const [nx, ny, wallX, wallY] = neighbors[Math.floor(Math.random() * neighbors.length)];
                        this.maze[ny][nx] = 0;
                        this.maze[wallY][wallX] = 0;
                        stack.push([nx, ny]);
                    } else {
                        stack.pop();
                    }
                }
                
                // Set start and end positions
                this.startPosition = { x: 1, y: 1 };
                this.endPosition = { x: this.cols - 2, y: this.rows - 2 };
                this.maze[this.endPosition.y][this.endPosition.x] = 2; // Mark end
                
                // Calculate valid path for progress tracking
                this.calculateValidPath();
                this.drawMaze();
            }

            calculateValidPath() {
                // Simple pathfinding to get the solution path length
                const queue = [[this.startPosition.x, this.startPosition.y, 0]];
                const visited = new Set();
                visited.add(`${this.startPosition.x},${this.startPosition.y}`);
                
                const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
                
                while (queue.length > 0) {
                    const [x, y, dist] = queue.shift();
                    
                    if (x === this.endPosition.x && y === this.endPosition.y) {
                        this.maxPathLength = dist;
                        break;
                    }
                    
                    for (let [dx, dy] of directions) {
                        const nx = x + dx;
                        const ny = y + dy;
                        const key = `${nx},${ny}`;
                        
                        if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows && 
                            this.maze[ny][nx] !== 1 && !visited.has(key)) {
                            visited.add(key);
                            queue.push([nx, ny, dist + 1]);
                        }
                    }
                }
            }

            drawMaze() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                for (let y = 0; y < this.rows; y++) {
                    for (let x = 0; x < this.cols; x++) {
                        const cellX = x * this.cellSize;
                        const cellY = y * this.cellSize;
                        
                        if (this.maze[y][x] === 1) {
                            // Wall
                            this.ctx.fillStyle = '#475569';
                            this.ctx.fillRect(cellX, cellY, this.cellSize, this.cellSize);
                            
                            // Wall highlight
                            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                            this.ctx.fillRect(cellX, cellY, this.cellSize, 2);
                        } else if (this.maze[y][x] === 2) {
                            // End zone
                            this.ctx.fillStyle = '#10b981';
                            this.ctx.fillRect(cellX + 2, cellY + 2, this.cellSize - 4, this.cellSize - 4);
                            
                            // Glow effect
                            this.ctx.shadowColor = '#10b981';
                            this.ctx.shadowBlur = 10;
                            this.ctx.fillRect(cellX + 2, cellY + 2, this.cellSize - 4, this.cellSize - 4);
                            this.ctx.shadowBlur = 0;
                        }
                    }
                }
            }

            positionOrb() {
                const pixelX = this.startPosition.x * this.cellSize + this.cellSize / 2 - 10;
                const pixelY = this.startPosition.y * this.cellSize + this.cellSize / 2 - 10;
                
                this.orb.style.left = pixelX + 'px';
                this.orb.style.top = pixelY + 'px';
                this.orbPosition = { x: this.startPosition.x, y: this.startPosition.y };
            }

            setupEventListeners() {
                let lastMousePos = { x: 0, y: 0 };
                
                this.container.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    lastMousePos = { x: e.clientX, y: e.clientY };
                });
                
                this.container.addEventListener('mousemove', (e) => {
                    if (!this.isDragging) return;
                    
                    const deltaX = e.clientX - lastMousePos.x;
                    const deltaY = e.clientY - lastMousePos.y;
                    
                    this.moveOrb(deltaX, deltaY);
                    lastMousePos = { x: e.clientX, y: e.clientY };
                });
                
                document.addEventListener('mouseup', () => {
                    this.isDragging = false;
                });
                
                // Touch events for mobile
                this.container.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.isDragging = true;
                    const touch = e.touches[0];
                    lastMousePos = { x: touch.clientX, y: touch.clientY };
                });
                
                this.container.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!this.isDragging) return;
                    
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - lastMousePos.x;
                    const deltaY = touch.clientY - lastMousePos.y;
                    
                    this.moveOrb(deltaX, deltaY);
                    lastMousePos = { x: touch.clientX, y: touch.clientY };
                });
                
                document.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.isDragging = false;
                });
            }

            moveOrb(deltaX, deltaY) {
                const sensitivity = 5;
                let newX = this.orbPosition.x;
                let newY = this.orbPosition.y;
                
                // Determine movement direction
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    // Horizontal movement
                    if (deltaX > sensitivity && this.canMoveTo(this.orbPosition.x + 1, this.orbPosition.y)) {
                        newX = this.orbPosition.x + 1;
                    } else if (deltaX < -sensitivity && this.canMoveTo(this.orbPosition.x - 1, this.orbPosition.y)) {
                        newX = this.orbPosition.x - 1;
                    }
                } else {
                    // Vertical movement
                    if (deltaY > sensitivity && this.canMoveTo(this.orbPosition.x, this.orbPosition.y + 1)) {
                        newY = this.orbPosition.y + 1;
                    } else if (deltaY < -sensitivity && this.canMoveTo(this.orbPosition.x, this.orbPosition.y - 1)) {
                        newY = this.orbPosition.y - 1;
                    }
                }
                
                if (newX !== this.orbPosition.x || newY !== this.orbPosition.y) {
                    this.orbPosition.x = newX;
                    this.orbPosition.y = newY;
                    
                    const pixelX = newX * this.cellSize + this.cellSize / 2 - 10;
                    const pixelY = newY * this.cellSize + this.cellSize / 2 - 10;
                    
                    this.orb.style.left = pixelX + 'px';
                    this.orb.style.top = pixelY + 'px';
                    
                    this.updateProgress();
                    this.checkCompletion();
                }
            }

            canMoveTo(x, y) {
                if (x < 0 || x >= this.cols || y < 0 || y >= this.rows) return false;
                return this.maze[y][x] !== 1; // Not a wall
            }

            updateProgress() {
                // Calculate distance from start
                const distanceFromStart = Math.abs(this.orbPosition.x - this.startPosition.x) + 
                                       Math.abs(this.orbPosition.y - this.startPosition.y);
                
                const progress = Math.min((distanceFromStart / this.maxPathLength) * 100, 95);
                this.progressFill.style.width = progress + '%';
                this.currentProgress = progress;
            }

            checkCompletion() {
                if (this.orbPosition.x === this.endPosition.x && this.orbPosition.y === this.endPosition.y) {
                    this.progressFill.style.width = '100%';
                    this.withdrawButton.disabled = false;
                    this.withdrawButton.classList.add('enabled');
                    this.showStatus('Security verification complete! 🎉', 'success');
                    
                    // Add celebration effect
                    this.orb.style.animation = 'pulse 0.5s infinite';
                }
            }

            showStatus(message, type) {
                const statusElement = document.getElementById('statusMessage');
                statusElement.textContent = message;
                statusElement.className = `status-message show ${type}`;
                
                setTimeout(() => {
                    statusElement.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize maze when page loads
        let mazeGame;
        document.addEventListener('DOMContentLoaded', () => {
            mazeGame = new SecureMazeWithdrawal();
            
            document.getElementById('withdrawButton').addEventListener('click', () => {
                if (mazeGame.userBalance <= 0) {
                    showModal('No Balance', 'You have no balance available for withdrawal.');
                } else {
                    showModal('Bank Details Required', null);
                }
            });
        });

        function showModal(title, message) {
            const modal = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            
            modalTitle.textContent = title;
            
            if (message) {
                modalContent.innerHTML = `<p style="color: #e2e8f0; margin: 20px 0;">${message}</p>`;
                document.querySelector('.modal-button.primary').style.display = 'none';
            } else {
                modalContent.innerHTML = `
                    <input type="text" id="accountNumber" placeholder="Account Number" maxlength="20">
                    <input type="text" id="routingNumber" placeholder="Routing Number" maxlength="9">
                    <input type="text" id="bankName" placeholder="Bank Name">
                `;
                document.querySelector('.modal-button.primary').style.display = 'block';
            }
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function confirmWithdrawal() {
            const accountNumber = document.getElementById('accountNumber')?.value;
            const routingNumber = document.getElementById('routingNumber')?.value;
            const bankName = document.getElementById('bankName')?.value;
            
            if (!accountNumber || !routingNumber || !bankName) {
                alert('Please fill in all bank details.');
                return;
            }
            
            // Simulate withdrawal process
            closeModal();
            mazeGame.showStatus('Withdrawal initiated successfully! 💰', 'success');
            
            // Reset the maze for next withdrawal
            setTimeout(() => {
                mazeGame.generateMaze();
                mazeGame.positionOrb();
                mazeGame.withdrawButton.disabled = true;
                mazeGame.withdrawButton.classList.remove('enabled');
                mazeGame.progressFill.style.width = '0%';
            }, 2000);
        }
    </script>
</body>
</html>
