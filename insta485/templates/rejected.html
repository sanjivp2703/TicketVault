<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Status</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Background gradient for professional look */
        body {
            background: linear-gradient(to right, #eef3f9, #cfe2ff);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* Main container */
        .status-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 6px 24px rgba(0, 0, 0, 0.12);
            width: 400px;
            text-align: center;
        }

        /* Status-specific styling */
        .status-waiting {
            border-left: 6px solid #e67e22;
        }

        .status-approved {
            border-left: 6px solid #27ae60;
        }

        .status-rejected {
            border-left: 6px solid #e74c3c;
        }

        /* Transaction amount */
        .amount {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }

        /* Status Messages */
        .status-message {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .waiting {
            color: #e67e22;
        }

        .approved {
            color: #27ae60;
        }

        .rejected {
            color: #e74c3c;
        }

        .status-message i {
            font-size: 24px;
            margin-right: 8px;
        }

        /* CTA Button */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
            box-shadow: 0px 6px 20px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>
<body>
<h1>Rejected by {{rejector}}</h1>
<a href="{{ url_for('show_index', user_type = user_type )}}" class="btn">Return Home</a>

</body>
</html>
